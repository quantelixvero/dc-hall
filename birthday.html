  <main class="page-main">
    <section class="page-hero compact">
      <div class="container" data-aos="fade-up">
        <p class="eyebrow" id="heroEyebrowText">Calendar & Celebrations</p>
        <h1 id="heroTitleText">Student Birthdays</h1>
        <p id="heroSubtitleText">Residential students' birthdays arranged in chronological order from January to December.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <!-- Search Bar -->
        <!-- Unified Compact Search & Filter Bar -->
        <div class="search-filter-view-bar" data-aos="fade-up">
          <div class="sfv-search-box">
            <svg class="search-icon-svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input id="birthdaySearch" class="sfv-input" type="search" placeholder="Search by name, room, roll or birthday...">
          </div>
          <div class="sfv-actions">
            <button type="button" class="compact-filter-btn" id="openBdayFilterBtn" aria-label="Open Filters">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
              </svg>
              <span class="btn-text">Filter</span>
              <span class="filter-count-badge" id="bdayFilterBadge" style="display:none;">0</span>
            </button>
          </div>
        </div>

        <!-- Compact Filter Modal Drawer for Birthday -->
        <div class="filter-drawer-overlay" id="bdayFilterOverlay" aria-hidden="true" style="display: none;">
          <div class="filter-drawer-card">
            <div class="filter-drawer-header">
              <div class="fd-title">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                  <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                </svg>
                <span>Filter Birthdays</span>
              </div>
              <button type="button" class="filter-drawer-close" id="closeBdayFilterBtn" aria-label="Close Filter">&times;</button>
            </div>
            <div class="filter-drawer-body">
              <div class="fd-grid">
                <div class="fd-group">
                  <label for="bdayMonthFilter">Month (মাস)</label>
                  <select id="bdayMonthFilter" class="fd-select">
                    <option value="all">All Months (সব মাস)</option>
                    <option value="01">January (জানুয়ারি)</option>
                    <option value="02">February (ফেব্রুয়ারি)</option>
                    <option value="03">March (মার্চ)</option>
                    <option value="04">April (এপ্রিল)</option>
                    <option value="05">May (মে)</option>
                    <option value="06">June (জুন)</option>
                    <option value="07">July (জুলাই)</option>
                    <option value="08">August (আগস্ট)</option>
                    <option value="09">September (সেপ্টেম্বর)</option>
                    <option value="10">October (অক্টোবর)</option>
                    <option value="11">November (নভেম্বর)</option>
                    <option value="12">December (ডিসেম্বর)</option>
                  </select>
                </div>
                <div class="fd-group">
                  <label for="bdayBatchFilter">Batch (ব্যাচ)</label>
                  <select id="bdayBatchFilter" class="fd-select">
                    <option value="all">All Batches (সব ব্যাচ)</option>
                    <option value="HSC-27">HSC-27 (Founder)</option>
                    <option value="HSC-28">HSC-28</option>
                    <option value="HSC-29">HSC-29</option>
                  </select>
                </div>
                <div class="fd-group">
                  <label for="bdayGroupFilter">Academic Group (শাখা)</label>
                  <select id="bdayGroupFilter" class="fd-select">
                    <option value="all">All Groups (সব শাখা)</option>
                    <option value="science">Science (বিজ্ঞান)</option>
                    <option value="commerce">Business Studies (ব্যবসায়)</option>
                    <option value="arts">Humanities (মানবিক)</option>
                  </select>
                </div>
                <div class="fd-group">
                  <label for="bdayBloodFilter">Blood Group (রক্তের গ্রুপ)</label>
                  <select id="bdayBloodFilter" class="fd-select">
                    <option value="all">All Blood Groups (সব গ্রুপ)</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                  </select>
                </div>
              </div>
              <div class="fd-quick-toggle" style="margin-top: 15px; padding: 10px 14px; background: rgba(16,185,129,0.08); border: 1px solid rgba(16,185,129,0.25); border-radius: 8px; display: flex; align-items: center; justify-content: space-between;">
                <label for="bdayTodayToggle" style="margin: 0; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px;">
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#10b981" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                  </svg>
                  <span>Born Today / আজ যাদের জন্মদিন</span>
                </label>
                <input type="checkbox" id="bdayTodayToggle" style="width: 18px; height: 18px; accent-color: #10b981; cursor: pointer;">
              </div>
            </div>
            <div class="filter-drawer-footer">
              <button type="button" class="fd-btn-reset" id="resetBdayFilterBtn">Reset All</button>
              <button type="button" class="fd-btn-apply" id="applyBdayFilterBtn">Apply Filters</button>
            </div>
          </div>
        </div>

        <!-- Dynamic Birthday Container -->
        <div id="birthdayContainer" data-month-filter="all"></div>
      </div>
    </section>
  </main>

  <footer class="footer">

    <article class="modal-panel">
      <button class="modal-close" type="button" aria-label="Close student profile" data-close-modal>&times;</button>
      <div id="modalContent"></div>
