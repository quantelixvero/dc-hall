        <div class="language-switch" aria-label="Language selector">
          <button type="button" data-lang-option="en" title="English">EN</button>
          <button type="button" data-lang-option="bn" title="বাংলা">BN</button>
        </div>
        <a href="profile.html" class="profile-toggle" id="profileBtn" aria-label="Profile Status / Login">

            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>

          <span aria-hidden="true">&#9789;</span>
        </button>
      </div>
    </div>
  </header>

  <main class="page-main">
    <section class="page-hero compact">
      <div class="container" data-aos="fade-up">
        <p class="eyebrow" id="heroEyebrowText">Calendar & Celebrations</p>
        <h1 id="heroTitleText">Student Birthdays</h1>
        <p id="heroSubtitleText">Residential students' birthdays arranged in chronological order from January to December.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <!-- Search Bar -->
        <div class="search-wrap" data-aos="fade-up" style="max-width: 680px; margin: 0 auto 20px;">
          <label for="birthdaySearch" class="sr-only">Search birthdays</label>
          <input id="birthdaySearch" class="search-input" type="search" placeholder="Search by student name, room or month...">
        </div>

        <!-- Month Filter Tabs (Clean English & Centered) -->
        <div class="bday-month-nav" id="monthNav" data-aos="fade-up">
          <button type="button" class="bday-month-pill active" data-month="all" onclick="filterBirthdayMonth('all')">All</button>
          <button type="button" class="bday-month-pill" data-month="1" onclick="filterBirthdayMonth('1')">Jan</button>
          <button type="button" class="bday-month-pill" data-month="2" onclick="filterBirthdayMonth('2')">Feb</button>
          <button type="button" class="bday-month-pill" data-month="3" onclick="filterBirthdayMonth('3')">Mar</button>
          <button type="button" class="bday-month-pill" data-month="4" onclick="filterBirthdayMonth('4')">Apr</button>
          <button type="button" class="bday-month-pill" data-month="5" onclick="filterBirthdayMonth('5')">May</button>
          <button type="button" class="bday-month-pill" data-month="6" onclick="filterBirthdayMonth('6')">Jun</button>
          <button type="button" class="bday-month-pill" data-month="7" onclick="filterBirthdayMonth('7')">Jul</button>
          <button type="button" class="bday-month-pill" data-month="8" onclick="filterBirthdayMonth('8')">Aug</button>
          <button type="button" class="bday-month-pill" data-month="9" onclick="filterBirthdayMonth('9')">Sep</button>
          <button type="button" class="bday-month-pill" data-month="10" onclick="filterBirthdayMonth('10')">Oct</button>
          <button type="button" class="bday-month-pill" data-month="11" onclick="filterBirthdayMonth('11')">Nov</button>
          <button type="button" class="bday-month-pill" data-month="12" onclick="filterBirthdayMonth('12')">Dec</button>
        </div>

        <!-- Dynamic Birthday Container -->
        <div id="birthdayContainer" data-month-filter="all"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner"></div>
  </footer>

  <!-- Student Profile Modal -->
  <div class="modal" id="studentModal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modalName">
    <div class="modal-backdrop" data-close-modal></div>
    <article class="modal-panel">
      <button class="modal-close" type="button" aria-label="Close student profile" data-close-modal>&times;</button>
      <div id="modalContent"></div>
    </article>
  </div>
