        </div>

            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>

  <main class="page-main">
    <section class="page-hero compact">
      <div class="container" data-aos="fade-up">
        <p class="eyebrow" id="heroEyebrowText">Calendar & Celebrations</p>
        <h1 id="heroTitleText">Student Birthdays</h1>
        <p id="heroSubtitleText">Residential students' birthdays arranged in chronological order from January to December.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <!-- Search Bar -->
        <!-- Unified Compact Search & Filter Bar -->
        <div class="search-filter-view-bar" data-aos="fade-up">
          <div class="search-wrap has-search-icon">
            <svg class="search-icon-svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <label for="birthdaySearch" class="sr-only">Search birthdays</label>
            <input id="birthdaySearch" class="search-input" type="search" placeholder="Search by name, room, roll or birthday...">
          </div>
          <div class="bar-actions">
            <button type="button" class="compact-filter-btn" id="openBdayFilterBtn" aria-label="Open Filters">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                <path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/>
              </svg>
              <span>Filter</span>
              <span class="active-filter-badge" id="bdayFilterBadge" style="display:none;">0</span>
            </button>
          </div>
        </div>

        <!-- Compact Filter Modal Drawer for Birthday -->
        <div class="filter-drawer-overlay" id="bdayFilterOverlay" aria-hidden="true" style="display: none;">
          <div class="filter-drawer-card">
            <div class="filter-drawer-header">
              <div class="fd-title">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                  <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                </svg>
                <span>Filter Birthdays</span>
              </div>
              <button type="button" class="filter-drawer-close" id="closeBdayFilterBtn" aria-label="Close Filter">&times;</button>
            </div>
            <div class="filter-drawer-body">
              <div class="fd-grid">
                <div class="filter-field">
                  <label for="bdayMonthFilter" data-i18n="birthday.filterMonth">Month</label>
                  <select id="bdayMonthFilter" class="filter-select">
                    <option value="all" data-i18n="birthday.allMonths">All Months</option>
                    <option value="01">January</option>
                    <option value="02">February</option>
                    <option value="03">March</option>
                    <option value="04">April</option>
                    <option value="05">May</option>
                    <option value="06">June</option>
                    <option value="07">July</option>
                    <option value="08">August</option>
                    <option value="09">September</option>
                    <option value="10">October</option>
                    <option value="11">November</option>
                    <option value="12">December</option>
                  </select>
                </div>
                <div class="filter-field">
                  <label for="bdayBatchFilter" data-i18n="filters.batch">Batch</label>
                  <select id="bdayBatchFilter" class="filter-select">
                    <option value="all" data-i18n="filters.allBatches">All Batches</option>
                    <option value="HSC-27">HSC-27 (Founder)</option>
                    <option value="HSC-28">HSC-28</option>
                    <option value="HSC-29">HSC-29</option>
                  </select>
                </div>
                <div class="filter-field">
                  <label for="bdayGroupFilter" data-i18n="filters.group">Academic Group</label>
                  <select id="bdayGroupFilter" class="filter-select">
                    <option value="all" data-i18n="filters.allGroups">All Groups</option>
                    <option value="science">Science</option>
                    <option value="commerce">Business Studies</option>
                    <option value="arts">Humanities</option>
                  </select>
                </div>
              </div>
              <div class="filter-field bday-today-filter-card" style="margin-top: 15px; padding: 12px 16px; background: rgba(16,201,168,0.08); border: 1px solid rgba(16,201,168,0.25); border-radius: 10px; display: flex; align-items: center; justify-content: space-between;">
                <label for="bdayTodayToggle" style="margin: 0; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 10px; color: var(--text);">
                  <svg viewBox="0 0 24 24" width="20" height="20" fill="var(--accent)">
                    <path d="M12 6a2 2 0 100-4 2 2 0 000 4zm7 5h-1V9a2 2 0 00-2-2h-3V5.8a3 3 0 10-2 0V7H8a2 2 0 00-2 2v2H5a3 3 0 00-3 3v2h20v-2a3 3 0 00-3-3zM4 18v2a2 2 0 002 2h12a2 2 0 002-2v-2H4z"/>
                  </svg>
                  <span data-i18n="birthday.birthdayToday">Birthday Today (আজকের জন্মদিন)</span>
                </label>
                <input type="checkbox" id="bdayTodayToggle" style="width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer;">
              </div>
            </div>
            <div class="filter-drawer-footer">
              <button type="button" class="btn-filter-reset" id="resetBdayFilterBtn" data-i18n="filters.reset">Reset All</button>
              <button type="button" class="btn-filter-apply" id="applyBdayFilterBtn" data-i18n="filters.apply">Apply Filters</button>
            </div>
          </div>
        </div>

        <!-- Dynamic Birthday Container -->
        <div id="birthdayContainer" data-month-filter="all"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner"></div>
  </footer>

  <!-- Student Profile Modal -->
  <div class="modal" id="studentModal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modalName">
    <div class="modal-backdrop" data-close-modal></div>
    <article class="modal-panel">
      <button class="modal-close" type="button" aria-label="Close student profile" data-close-modal>&times;</button>
      <div id="modalContent"></div>
    </article>
  </div>
