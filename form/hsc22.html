    .form-header-card {
      background: var(--surface-strong);

      border-radius: 18px;

      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
    }
    .form-batch-badge {
      display: inline-flex;
      align-items: center;

      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.12);
      color: #10b981;

      font-weight: 700;
      width: fit-content;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .form-main-title {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--text);
      line-height: 1.3;
      margin: 0;
    }
    .form-description-text {
      font-size: 0.95rem;
      color: var(--muted);
      line-height: 1.6;
      margin: 0;
    }
    .form-direct-btn {
      display: inline-flex;

    .form-iframe-wrapper {

      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.06);

    }
    .form-iframe-element {
      width: 100%;
      height: 950px;
      border: none;
      display: block;
    }
    .form-state-card {
      background: var(--surface-strong);
      border: 1px solid var(--border);
      border-radius: 18px;

    .form-btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      transition: opacity 0.2s ease;
    }

  <main class="page-main">
    <div class="form-page-container" id="formContainer">

            <span>Open in new tab if form does not display properly</span>
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
              <polyline points="15 3 21 3 21 9"></polyline>

          </a>
        </div>

        <div class="form-iframe-wrapper" data-aos="fade-up">
          <iframe class="form-iframe-element" src="https://docs.google.com/forms/d/e/1FAIpQLSf3-kxiNBCn7Tk75Mj2WXMJBUA6a1TnUMLF63-_ccWUSJ01aQ/viewform?embedded=true" frameborder="0" marginheight="0" marginwidth="0">Loading form…</iframe>

  <footer class="footer">

  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script src="../../js/sanity-client.js?v=7.3"></script>
  <script src="../../js/app.js?v=7.3"></script>
  <script>
    (function () {
      

      // Dynamic bilingual switch
      const titleBn = "HSC-27 Data Entry For Website";
      const descBn = "";
      const titleEn = "HSC-27 Data Entry For Website";
      const descEn = "";

      function updateFormText() {
        const lang = localStorage.getItem('dc-hostel-lang') || 'en';
        const tEl = document.getElementById('formTitleText');
        const dEl = document.getElementById('formDescText');
        if (tEl) tEl.textContent = (lang === 'bn' && titleBn) ? titleBn : titleEn;
        if (dEl && (descBn || descEn)) dEl.textContent = (lang === 'bn' && descBn) ? descBn : descEn;
      }

      window.addEventListener('storage', updateFormText);
      document.querySelectorAll('[data-lang-option]').forEach(btn => {
        btn.addEventListener('click', () => setTimeout(updateFormText, 100));
      });
      updateFormText();
    })();
  </script>
</body>
