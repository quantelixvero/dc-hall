<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Page Not Found | Dhaka College International Hall</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function() {
      var path = window.location.pathname;
      var search = window.location.search;

      // 1. Dynamic /form/:slug routing for GitHub Pages
      var formMatch = path.match(/^\/form\/([a-zA-Z0-9_-]+)/i);
      if (formMatch && formMatch[1]) {
        var slug = formMatch[1].replace('.html', '');
        window.location.replace('/form.html?f=' + encodeURIComponent(slug) + (search ? '&' + search.substring(1) : ''));
        return;
      }

      // 2. Dynamic /event/:slug routing
      var eventMatch = path.match(/^\/event\/([a-zA-Z0-9_-]+)/i);
      if (eventMatch && eventMatch[1]) {
        var evSlug = eventMatch[1].replace('.html', '');
        window.location.replace('/gallery.html#event=' + encodeURIComponent(evSlug));
        return;
      }

      // 3. /admin routing
      if (path.indexOf('/admin') === 0) {
        window.location.replace('https://dchall.sanity.studio/');
        return;
      }
    })();
  </script>
  <script>
    (function () {
      try {
        if (localStorage.getItem("dc-hostel-theme") === "dark") {
          document.documentElement.classList.add("dark");
          document.documentElement.dataset.theme = "dark";
        }
      } catch (error) {}
    })();
  </script>
  <link rel="icon" type="image/png" sizes="512x512" href="./assets/favicons/favicon-512x512.png">
  <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="./assets/favicons/favicon.ico">
